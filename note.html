<script>        // 页面加载完成后从 localStorage 读取数据并填充
window.addEventListener('DOMContentLoaded', function() {
    try {
        const leaveDataStr = localStorage.getItem('leaveNoteData');
        if (leaveDataStr) {
            const leaveData = JSON.parse(leaveDataStr);

            // 获取所有 box 元素
            const boxes = document.querySelectorAll('.box');

            // 遍历并填充数据
            boxes.forEach(box => {
                const boxL = box.querySelector('.box-l');
                const boxR = box.querySelector('.box-r');

                if (boxL && boxR) {
                    const label = boxL.textContent.trim();

                    switch(label) {
                        case '姓名':
                            boxR.textContent = leaveData.name || '';
                            break;
                        case '学院':
                            boxR.textContent = leaveData.college || '';
                            break;
                        case '学号':
                            boxR.textContent = leaveData.studentId || '';
                            break;
                        case '请假期限':
                            boxR.textContent = leaveData.leavePeriod || '';
                            break;
                        case '签发时间':
                            boxR.textContent = leaveData.issueDate || '';
                            break;
                    }
                }
            });
        }
    } catch (e) {
        console.error('读取请假数据失败:', e);
    }
});
</script>
